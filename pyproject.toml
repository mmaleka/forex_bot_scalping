[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-bolt-scalping"
version = "0.1.0"
description = "Rule-based FX scalping bot: broker-agnostic core + Tickerall/Exness execution."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tickerall>=0.7.1",
    "pandas>=1.5",
    "numpy>=1.23",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
forexbot = "forexbot.__main__:main"

[tool.setuptools.packages.find]
include = ["forexbot*"]
