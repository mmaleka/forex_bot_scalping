# EXPERIMENT VARIANT of config/default.yaml — identical except trailing is OFF.
# Used to isolate the trailing stop's contribution in backtests. Do not use live.

mode: paper

symbols:
  - EURUSDm

timeframe: M15

strategy:
  name: ensemble
  params:
    min_votes: 2
    min_close_votes: 2
    members:
      - name: ma_cross
        params: {fast: 20, slow: 50}
        weight: 1.0
      - name: donchian_breakout
        params: {lookback: 20}
        weight: 1.0
      - name: rsi_reversion
        params: {period: 14, oversold: 30, overbought: 70}
        weight: 1.0
      - name: bollinger_reversion
        params: {period: 20, num_std: 2.0}
        weight: 1.0
      - name: choch_strategy
        params:
          pivot_k: 2
        weight: 1.0

broker:
  name: paper

risk:
  sizing_mode: risk
  fixed_lot_size: 0.1
  fixed_lot_size_jpy: 0.01
  risk_per_trade_pct: 0.5
  floor_to_min_lot: true
  stop_loss_atr_mult: 2.0
  take_profit_atr_mult: 0.0
  max_concurrent_positions: 10
  max_positions_per_symbol: 1
  max_daily_loss_pct: 10.0
  max_exposure_pct: 10.0
  atr_period: 14

trailing:
  enabled: false            # ← the only difference vs default.yaml

engine:
  stream: false
  poll_interval_s: 1.0

logging:
  level: INFO
  file: data/bot.log
